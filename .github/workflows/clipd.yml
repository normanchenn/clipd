name: clipd

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  clipd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-go@v4
        with:
          go-version: '^1.23.0'

      - name: Install dependencies
        run: go mod tidy
        working-directory: ./daemon

      - name: Build
        run: go build -v ./...
        working-directory: ./daemon

      - name: Run tests
        run: go test -v ./...
        working-directory: ./daemon
